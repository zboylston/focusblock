kind = "web"
previewPath = "/"
title = "FocusBlock"
version = "1.0.0"
id = "artifacts/focusblock"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26006

[services.development]
run = "pnpm --filter @workspace/focusblock run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/focusblock", "run", "build" ]
publicDir = "artifacts/focusblock/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26006"
BASE_PATH = "/"
