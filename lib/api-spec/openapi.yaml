openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FocusBlock API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tasks
    description: Focus block / timeline operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tasks:
    post:
      operationId: createTasks
      tags: [tasks]
      summary: Create planner tasks (expands chunks)
      description: Creates one task row per chunk (e.g. 3 chunks creates 3 rows with the same name)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Tasks created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /tasks/timeline:
    get:
      operationId: getTimeline
      tags: [tasks]
      summary: Paginated timeline of tasks across days
      description: >-
        Returns tasks grouped-ready for the timeline, newest day first, a page
        of days at a time. Pass the previous page's nextCursor as `before` to
        load older days.
      parameters:
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Only return days strictly before this calendar date (YYYY-MM-DD)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 31
            default: 7
          description: Number of distinct days to return in this page
      responses:
        "200":
          description: A page of timeline tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelinePage"

  /tasks/stats/today:
    get:
      operationId: getTodayStats
      tags: [tasks]
      summary: Get today's focus stats
      description: Returns aggregated stats for today (completed blocks and minutes focused)
      responses:
        "200":
          description: Today's stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayStats"

  /tasks/complete-focus:
    post:
      operationId: completeFocus
      tags: [tasks]
      summary: Complete a focus block for a task by name
      description: >-
        Marks the next open block for the given name (today) as done. If no open
        block exists, a new completed block is created for today. Returns the
        completed task so the caller can attach a rating.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteFocusInput"
      responses:
        "200":
          description: Block completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      description: Mark a task done, rename it, attach a rating/notes, or adjust plays
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Task:
      type: object
      required: [id, name, date, chunkIndex, totalChunks, completed, plays, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        date:
          type: string
          format: date
        chunkIndex:
          type: integer
          description: 1-based index within its block group
        totalChunks:
          type: integer
        completed:
          type: boolean
        plays:
          type: integer
          description: Number of times the timer was triggered for this task group
        description:
          type: ["string", "null"]
          description: "Task-group note / plan (stored on the first block of the group)"
        link:
          type: ["string", "null"]
          description: "Reference URL attached to the task group"
        rating:
          type: ["string", "null"]
          description: "Emoji rating: 😩 | 😐 | 🙂 | 🔥"
        notes:
          type: ["string", "null"]
          description: "What was worked on during this block"
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    TaskInput:
      type: object
      required: [name, chunks]
      properties:
        name:
          type: string
          minLength: 1
        chunks:
          type: integer
          minimum: 1
          maximum: 16
        date:
          type: string
          format: date

    TaskUpdate:
      type: object
      properties:
        completed:
          type: boolean
        name:
          type: string
        rating:
          type: string
          enum: ["😩", "😐", "🙂", "🔥"]
        notes:
          type: string
          description: "What was worked on during this block"
        description:
          type: string
          description: "Task-group note / plan (empty string clears it)"
        link:
          type: string
          description: "Reference URL for the task group (empty string clears it)"
        plays:
          type: integer
          minimum: 0
        incrementPlays:
          type: integer
          minimum: 1
          description: Atomically add this many plays to the current value

    CompleteFocusInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    TimelinePage:
      type: object
      required: [tasks, hasMore]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        nextCursor:
          type: ["string", "null"]
          format: date
          description: Pass as `before` to load the next (older) page; null when no older days exist
        hasMore:
          type: boolean

    TodayStats:
      type: object
      required: [totalBlocks, totalMinutes, openPlannedBlocks]
      properties:
        totalBlocks:
          type: integer
        totalMinutes:
          type: integer
        openPlannedBlocks:
          type: integer
          description: Remaining planned focus blocks across all open task groups (any day), clamped per group so over-estimated groups never go negative.
