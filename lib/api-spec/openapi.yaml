openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FocusBlock API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Focus session log operations
  - name: tasks
    description: Daily planner task operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List focus sessions
      description: Returns all focus sessions for today ordered by most recent
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: ISO date string (YYYY-MM-DD) to filter sessions, defaults to today
      responses:
        "200":
          description: List of focus sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a focus session
      description: Records a completed 30-minute focus session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /sessions/{id}:
    patch:
      operationId: rateSession
      tags: [sessions]
      summary: Rate a focus session
      description: Updates the focus rating for a completed session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRating"
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session not found

  /sessions/stats/today:
    get:
      operationId: getTodayStats
      tags: [sessions]
      summary: Get today's session stats
      description: Returns aggregated stats for today (total sessions, ratings breakdown)
      responses:
        "200":
          description: Today's stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayStats"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List daily planner tasks
      description: Returns all tasks for today's daily planner
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: ISO date string (YYYY-MM-DD) to filter tasks, defaults to today
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTasks
      tags: [tasks]
      summary: Create planner tasks (expands chunks)
      description: Creates one task row per chunk (e.g. 3 chunks creates 3 rows with the same name)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Tasks created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      description: Mark a task as completed or update its name
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Task deleted
        "404":
          description: Task not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Session:
      type: object
      required: [id, taskName, completedAt, durationMinutes]
      properties:
        id:
          type: integer
        taskName:
          type: string
        completedAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        rating:
          type: ["string", "null"]
          description: "Emoji rating: 😩 | 😐 | 🙂 | 🔥"
        notes:
          type: ["string", "null"]
          description: "What was worked on during this session"

    SessionInput:
      type: object
      required: [taskName]
      properties:
        taskName:
          type: string
          minLength: 1
        durationMinutes:
          type: integer
          default: 30

    SessionRating:
      type: object
      required: [rating]
      properties:
        rating:
          type: string
          enum: ["😩", "😐", "🙂", "🔥"]
        notes:
          type: string
          description: "What was worked on during this session"

    TodayStats:
      type: object
      required: [totalSessions, totalMinutes, ratingsBreakdown]
      properties:
        totalSessions:
          type: integer
        totalMinutes:
          type: integer
        ratingsBreakdown:
          type: object
          properties:
            distracted:
              type: integer
            okay:
              type: integer
            good:
              type: integer
            great:
              type: integer
          required: [distracted, okay, good, great]

    Task:
      type: object
      required: [id, name, date, chunkIndex, totalChunks, completed, plays, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        date:
          type: string
          format: date
        chunkIndex:
          type: integer
          description: 1-based index within its block group
        totalChunks:
          type: integer
        completed:
          type: boolean
        plays:
          type: integer
          description: Number of times the timer was triggered for this task group
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    TaskInput:
      type: object
      required: [name, chunks]
      properties:
        name:
          type: string
          minLength: 1
        chunks:
          type: integer
          minimum: 1
          maximum: 16
        date:
          type: string
          format: date

    TaskUpdate:
      type: object
      properties:
        completed:
          type: boolean
        name:
          type: string
        plays:
          type: integer
          minimum: 0
        incrementPlays:
          type: integer
          minimum: 1
          description: Atomically add this many plays to the current value
